version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "vite"
          - "vitest"
          - "prettier"
          - "@types/*"
    ignore:
      # 由 docs/dev-rules/dependency-admission.md 与 ADR 控制，
      # package.json 的 overrides 精确锁定，升级必须走人工评审。
      - dependency-name: "electron"
      - dependency-name: "better-sqlite3"
      - dependency-name: "zod"
      - dependency-name: "drizzle-orm"
      # typescript-eslint 尚不支持 TS 7（PR #4 被 CI 拦下）。
      # typescript-eslint 官方支持 TS >= 7.1 后人工解除。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
