packages:
  - packages/*
  - plugins/*
  - apps/*
nodeLinker: hoisted
# New versions are taken only once they are 7 days old; Dependabot's cooldown and scripts/deps.mjs use the same age.
minimumReleaseAge: 10080
allowBuilds:
  esbuild: true
  better-sqlite3: true
  electron: true
  "@tailwindcss/oxide": true
  protobufjs: true
  "@google/genai": true
  core-js: false
  lfa-ponyfill: false
  es5-ext: false
  utp-native: false
  bufferutil: false
  utf-8-validate: false
  ip-set: false
  node-datachannel: false
  electron-winstaller: false
overrides:
  "@electron/rebuild": "4.2.0"
  # Security fixes for transitive dependencies (dependency audit 2026-11-14).
  "undici@6": "6.29.1"
  "undici@7": "7.30.2"
  "ip-address@10": "10.7.6"
