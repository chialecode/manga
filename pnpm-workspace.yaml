packages:
  - packages/*
  - plugins/*
  - apps/*
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  better-sqlite3: true
  electron: true
  "@tailwindcss/oxide": true
  protobufjs: true
  "@google/genai": true
  core-js: false
  lfa-ponyfill: false
  es5-ext: false
  utp-native: false
  bufferutil: false
  utf-8-validate: false
  ip-set: false
  node-datachannel: false
overrides:
  "@electron/rebuild": "4.2.0"
